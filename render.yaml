services:
  - type: web
    name: demobacchien
    runtime: node
    plan: free
    buildCommand: npm install --prefix server --include=dev && npm install --prefix client --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATA_KEY
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: ONLYOFFICE_URL
        value: https://df3376cf.docs.onlyoffice.com
      - key: ONLYOFFICE_INTERNAL_URL
        value: https://df3376cf.docs.onlyoffice.com
      - key: ONLYOFFICE_APP_URL
        value: https://demobacchien-1.onrender.com
      - key: ONLYOFFICE_JWT_SECRET
        sync: false
      - key: ONLYOFFICE_JWT_HEADER
        value: AuthorizationJWT
